server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: account-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5433/account_db}
    username: ${ACCOUNT_DB_USER:account}
    password: ${ACCOUNT_DB_PASSWORD:account}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false          # no lazy loading from the web layer - N+1 must be fixed in the service/repo layer
    hibernate:
      ddl-auto: validate         # Flyway owns the schema, Hibernate only validates it
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false   # flip to true (or use datasource-proxy) in Phase 2 to count queries
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
